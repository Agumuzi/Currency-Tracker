name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Build and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, xcode-27]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check localizations
        run: python3 scripts/check-localizations.py

      - name: Run unit tests
        run: xcodebuild test -scheme "Currency Tracker" -destination "platform=macOS" -derivedDataPath "$PWD/.build/DerivedData" -only-testing:"Currency TrackerTests"

      - name: Run UI tests and capture all language screenshots
        run: xcodebuild test -scheme "Currency Tracker" -destination "platform=macOS" -derivedDataPath "$PWD/.build/DerivedData" -resultBundlePath "$PWD/.build/UI-Tests.xcresult" -only-testing:"Currency TrackerUITests"

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: currency-tracker-ui-tests-${{ matrix.runner }}
          path: .build/UI-Tests.xcresult
